[workspace]
resolver = "3"
members = ["crates/mc-protocol", "crates/mc-data", "crates/mc-server", "crates/mc-probe"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v3"] }
md-5 = "0.10"
sha1 = "0.10"
aes = "0.8"
cfb8 = "0.8"
rand = "0.8"
rsa = "0.9"
mc-protocol = { path = "crates/mc-protocol" }
mc-data = { path = "crates/mc-data" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
